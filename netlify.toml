# Netlify build configuration.
#
# The Next.js Runtime is detected and installed automatically; it turns the
# App Router's server routes into Netlify Functions and serves the prerendered
# pages from the CDN. Nothing in the application code changes.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

  # Netlify scans the build output for environment-variable values and fails
  # the deploy when it finds one. NEXT_PUBLIC_* values are *supposed* to appear
  # there — Next inlines them into the browser bundle by design — so without
  # this the first build fails with a "secrets detected" error that looks
  # alarming and isn't. Only genuinely public keys are listed; the real secrets
  # (Razorpay, Supabase service role, Resend) are deliberately absent and stay
  # scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_RAZORPAY_KEY_ID,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_GA4_MEASUREMENT_ID,NEXT_PUBLIC_META_PIXEL_ID,NEXT_PUBLIC_WHATSAPP_GROUP_URL,NEXT_PUBLIC_BOOLEAN_CHEATSHEET_URL"

# Security headers are also set in next.config.ts, which covers server-rendered
# responses. These cover static assets served straight from the CDN, which
# never touch the Next.js server.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Immutable build assets — safe to cache forever because the filenames are
# content-hashed.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hold the prerendered marketing HTML at the edge.
#
# These pages are already static (Next marks them ● at build), but Netlify
# still invoked a function to hand back HTML it had already generated, and the
# cold start showed up as 780–1,140ms of server response time in Lighthouse —
# the single largest component of LCP on mobile.
#
# `Netlify-CDN-Cache-Control` governs the edge only; the browser still gets a
# short `Cache-Control`, so a visitor never sees stale copy after a deploy.
# Netlify purges its CDN on every deploy, so the long s-maxage cannot outlive
# a content change.
#
# Paths are listed explicitly and /api/* is deliberately absent. Caching a
# checkout or webhook response at the edge would be a serious correctness bug
# — one buyer could be served another buyer's order payload.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/courses/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/lp/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/legal/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=86400, stale-while-revalidate=604800"
